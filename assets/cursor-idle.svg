<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
  <defs>
    <linearGradient id="gemGold" x1="2" y1="2" x2="18" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff0c4"/>
      <stop offset="60%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6112"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f3c77c" flood-opacity="0.85"/>
    </filter>
  </defs>
  <!-- Outer Dark Contour -->
  <path d="M10 1 Q10 10 19 10 Q10 10 10 19 Q10 10 1 10 Q10 10 10 1 Z" fill="#06070a" stroke="#06070a" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- 24K Gold Gem Star Fill -->
  <path d="M10 1 Q10 10 19 10 Q10 10 10 19 Q10 10 1 10 Q10 10 10 1 Z" fill="url(#gemGold)" stroke="#ffffff" stroke-width="0.6" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Specular Facets -->
  <line x1="10" y1="3" x2="10" y2="17" stroke="rgba(255, 255, 255, 0.85)" stroke-width="0.6" stroke-linecap="round"/>
  <line x1="3" y1="10" x2="17" y2="10" stroke="rgba(255, 255, 255, 0.85)" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="10" cy="10" r="1.6" fill="#ffffff"/>
  <circle cx="10" cy="10" r="2.8" fill="rgba(243, 199, 124, 0.45)"/>
</svg>